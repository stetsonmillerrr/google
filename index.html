<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Iframe Loader</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .error {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            color: #ff5252;
            font-size: 14px;
            background: rgba(40, 40, 40, 0.9);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="errorMsg" class="error"></div>
    <iframe id="targetFrame" src="https://google.com"></iframe>
    <script>
        window.addEventListener('resize', () => {
            const iframe = document.getElementById('targetFrame');
            iframe.style.width = window.innerWidth + 'px';
            iframe.style.height = window.innerHeight + 'px';
        });
    </script>
</body>
</html>
