<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Theme Tabbed Iframe Loader</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .tab-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            width: 100%;
            background: #1e1e1e;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 10px;
        }
        .tab {
            padding: 8px 16px;
            background: #333;
            color: #e0e0e0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .tab:hover {
            background: #444;
        }
        .tab.active {
            background: #28a745;
        }
        iframe {
            width: 100%;
            height: calc(100% - 48px);
            border: none;
            display: none;
            margin-top: 48px;
        }
        iframe.active {
            display: block;
        }
        .error {
            position: fixed;
            top: 60px;
            left: 10px;
            z-index: 1000;
            color: #ff5252;
            font-size: 14px;
            background: rgba(40, 40, 40, 0.9);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="tab-container">
        <button class="tab active" onclick="switchTab(0)">Google</button>
        <button class="tab" onclick="switchTab(1)">Example</button>
    </div>
    <div id="errorMsg" class="error"></div>
    <iframe id="frame0" src="about:blank" class="active" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-top-navigation"></iframe>
    <iframe id="frame1" src="about:blank" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-top-navigation"></iframe>
    <script>
        const tabs = [
            { url: 'https://www.google.com', id: 'frame0' },
            { url: 'https://example.com', id: 'frame1' }
        ];

        async function loadIframe(tabIndex) {
            const { url, id } = tabs[tabIndex];
            const iframe = document.getElementById(id);
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';

            const proxyUrl = `/api/proxy?url=${encodeURIComponent(url)}`;

            try {
                const response = await fetch(proxyUrl, { cache: 'force-cache' });
                if (!response.ok) throw new Error('Proxy request failed');
                const text = await response.text();
                const blob = new Blob([text], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                iframe.src = blobUrl;
                iframe.onload = () => URL.revokeObjectURL(blobUrl);
            } catch (err) {
                errorMsg.textContent = `Failed to load ${url}. Trying direct load...`;
                console.error(err);
                iframe.src = url;
            }
        }

        function switchTab(tabIndex) {
            document.querySelectorAll('.tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === tabIndex);
            });
            document.querySelectorAll('iframe').forEach((iframe, i) => {
                iframe.classList.toggle('active', i === tabIndex);
            });
            if (!document.getElementById(tabs[tabIndex].id).src.includes('blob:')) {
                loadIframe(tabIndex);
            }
        }

        window.addEventListener('resize', () => {
            document.querySelectorAll('iframe').forEach(iframe => {
                iframe.style.width = window.innerWidth + 'px';
                iframe.style.height = (window.innerHeight - 48) + 'px';
            });
        });

        window.onload = () => loadIframe(0);
    </script>
</
